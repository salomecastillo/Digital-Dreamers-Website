<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Digital Dreamers - Contact Us</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="logo-container">
      <img src="images/DDP-star-logo.png" alt="Digital Dreamers Logo" class="logo-img">
      <div class="logo">Digital Dreamers</div>
    </div>
  
    <div class="hamburger" id="hamburger">
      &#9776;
    </div>
  
    <nav id="nav-menu">
      <a href="index.html">Home</a>
      <a href="blog.html">Dreamer Feed</a>
      <a href="projects.html">Projects</a>
      <a href="join.html">Join Now</a>
      <a href="contact.html">Contact</a>
      <a href="donate.html">Donate</a>
    </nav>
  </header>
  
  

  <section class="section lavender contact-section">
    <div class="contact-container">
      <h2>Contact Us</h2>
      <p>Have a question, idea, or want to get involved? We'd love to hear from you!</p>
      <p> Or get in touch directly at: digitaldreamersprojectinfo@gmail.com </p>
      <form class="contact-form" action="mailto:your@email.com" method="post" enctype="text/plain">
        <div class="form-group">
          <label for="name">Your Name</label>
          <input type="text" id="name" name="name" required />
        </div>
        <div class="form-group">
          <label for="email">Your Email</label>
          <input type="email" id="email" name="email" required />
        </div>
        <div class="form-group">
          <label for="message">Your Message</label>
          <textarea id="message" name="message" rows="6" required></textarea>
        </div>
        <button type="submit" class="cta-button">Send Message</button>
      </form>
    </div>
  </section>

  <footer>
     2025 Digital Dreamers. Built with 💜 by passionate students.
  </footer>
  <script>
    const hamburger = document.getElementById('hamburger');
    const navMenu = document.getElementById('nav-menu');
  
    hamburger.addEventListener('click', () => {
      navMenu.classList.toggle('active');
    });
  </script>
  
</body>
</html>
